<template>

    <!-- Button rendered directly on the Quote record page -->
    <lightning-button
        label="Change End Date"
        icon-name="utility:event"
        variant="neutral"
        onclick={handleOpenModal}>
    </lightning-button>

    <!-- Modal -->
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Change Quote End Date"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={handleClose} disabled={isPatching}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title">Change Quote End Date</h2>
                    <p class="slds-m-top_x-small slds-text-color_inverse-weak slds-text-body_small">
                        Updates End Date + SubscriptionTerm on all lines via PST PATCH and re-runs pricing.
                    </p>
                </header>

                <div class="slds-modal__content slds-p-around_medium">

                    <!-- Loading spinner -->
                    <template if:true={isLoading}>
                        <div class="slds-align_absolute-center slds-p-around_large">
                            <lightning-spinner alternative-text="Loading quote" size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <!-- Form -->
                    <template if:false={isLoading}>
                        <template if:true={quoteContext}>

                            <!-- Current state summary -->
                            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                                <div class="slds-grid slds-gutters">
                                    <div class="slds-col">
                                        <p class="slds-text-body_small slds-text-color_weak">Start Date</p>
                                        <p class="slds-text-body_regular">{currentStartDateDisplay}</p>
                                    </div>
                                    <div class="slds-col">
                                        <p class="slds-text-body_small slds-text-color_weak">Current End Date</p>
                                        <p class="slds-text-body_regular">{currentEndDateDisplay}</p>
                                    </div>
                                    <div class="slds-col">
                                        <p class="slds-text-body_small slds-text-color_weak">Lines</p>
                                        <p class="slds-text-body_regular">{lineCount}</p>
                                    </div>
                                </div>
                            </div>

                            <!-- New end date input -->
                            <lightning-input
                                type="date"
                                label="New End Date"
                                value={newEndDate}
                                onchange={handleDateChange}
                                disabled={isPatching}>
                            </lightning-input>

                            <!-- Term preview -->
                            <template if:true={showTermPreview}>
                                <div class="slds-box slds-theme_info slds-m-top_small">
                                    <p class="slds-text-body_small">
                                        New term: <strong>{newTermMonths} months</strong>.
                                        SubscriptionTerm on all lines will be updated to match.
                                    </p>
                                </div>
                            </template>

                            <!-- Patching status -->
                            <template if:true={isPatching}>
                                <div class="slds-m-top_medium slds-align_absolute-center">
                                    <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
                                    <p class="slds-text-body_small slds-m-top_small slds-text-align_center">{patchStatus}</p>
                                </div>
                            </template>

                        </template>

                        <!-- Error -->
                        <template if:true={errorMessage}>
                            <div class="slds-box slds-theme_error slds-m-top_medium">
                                <p class="slds-text-body_small">{errorMessage}</p>
                            </div>
                        </template>
                    </template>

                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={handleClose}
                        disabled={isPatching}
                        class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button
                        label={saveLabel}
                        variant="brand"
                        onclick={handleSave}
                        disabled={isSaveDisabled}>
                    </lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>

        <!-- VF session token iframe -->
        <iframe src="/apex/BullhornSessionProvider" onload={handleIframeLoad}
            style="display:none;" title="Session Provider"></iframe>
    </template>

</template>
