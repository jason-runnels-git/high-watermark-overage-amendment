<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Billing Frequency Management"
        class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 class="slds-modal__title">Billing Frequency Management</h2>
                <p class="slds-m-top_x-small slds-text-color_inverse-weak slds-text-body_small">
                    Step {currentStep} of 3 &mdash; {stepLabel}
                </p>
            </header>

            <div class="slds-modal__content slds-p-around_medium">

                <!-- STEP 1: Select Contract -->
                <template if:true={isStep1}>
                    <template if:true={isLoading}>
                        <div class="slds-align_absolute-center slds-p-around_large">
                            <lightning-spinner alternative-text="Loading contracts" size="medium"></lightning-spinner>
                        </div>
                    </template>
                    <template if:false={isLoading}>
                        <p class="slds-text-body_regular slds-m-bottom_medium">Select the contract to renew:</p>
                        <template if:true={noContracts}>
                            <div class="slds-box slds-theme_shade">
                                <p class="slds-text-body_small">No active contracts with assets found for this account.</p>
                            </div>
                        </template>
                        <template for:each={contracts} for:item="c">
                            <div key={c.contractId} class={c.cardClass} onclick={handleContractSelect} data-id={c.contractId}>
                                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small" data-id={c.contractId}>
                                    <div class="slds-col" data-id={c.contractId}>
                                        <p class="slds-text-heading_small" data-id={c.contractId}>Contract {c.contractNumber}</p>
                                    </div>
                                    <div class="slds-col slds-text-align_right" data-id={c.contractId}>
                                        <template if:true={c.isSelected}>
                                            <lightning-badge label="Selected"></lightning-badge>
                                        </template>
                                    </div>
                                </div>
                                <div class="info-section" data-id={c.contractId}>
                                    <div class="slds-grid" data-id={c.contractId}>
                                        <div class="slds-col" data-id={c.contractId}>
                                            <span class="slds-text-body_small slds-text-color_weak" data-id={c.contractId}>
                                                {c.startDate} &mdash; {c.endDateDisplay}
                                            </span>
                                        </div>
                                        <div class="slds-col slds-text-align_right" data-id={c.contractId}>
                                            <span class="slds-text-body_small" data-id={c.contractId}>
                                                {c.assetCount} asset(s)
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </template>
                </template>

                <!-- STEP 2: Configure lines -->
                <template if:true={isStep2}>
                    <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                        <p class="slds-text-heading_small">Contract {selectedContract.contractNumber}</p>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Select a target billing frequency for each product. Products with no upgrade options are shown but cannot be changed.
                        </p>
                    </div>

                    <!-- Renewal contract selection -->
                    <div class="slds-box slds-m-bottom_medium contract-selection-box">
                        <p class="section-label slds-m-bottom_x-small">RENEWAL CONTRACT</p>
                        <lightning-radio-group
                            name="renewalContractMode"
                            options={renewalContractModeOptions}
                            value={renewalContractMode}
                            type="radio"
                            onchange={handleContractModeChange}>
                        </lightning-radio-group>
                        <template if:true={showExistingContractPicker}>
                            <template if:true={hasExistingContracts}>
                                <lightning-combobox
                                    label="Select Contract"
                                    value={selectedRenewalContractId}
                                    placeholder="Choose a contract..."
                                    options={existingContractOptions}
                                    onchange={handleExistingContractChange}
                                    class="slds-m-top_x-small">
                                </lightning-combobox>
                            </template>
                            <template if:false={hasExistingContracts}>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                    No other active contracts found on this account.
                                    Switch to "Auto-create" to generate a new one.
                                </p>
                            </template>
                        </template>
                    </div>

                    <div class="slds-grid slds-gutters slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input
                                type="date"
                                label="Renewal Start Date"
                                value={renewalStartDate}
                                onchange={handleStartDateChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input
                                type="date"
                                label="Renewal End Date"
                                value={renewalEndDate}
                                onchange={handleEndDateChange}>
                            </lightning-input>
                        </div>
                    </div>

                    <!-- Line items table header -->
                    <div class="line-table-header slds-grid slds-m-bottom_x-small">
                        <div class="slds-col slds-size_3-of-12"><span class="col-header">Product</span></div>
                        <div class="slds-col slds-size_1-of-12 slds-text-align_right"><span class="col-header">Qty</span></div>
                        <div class="slds-col slds-size_2-of-12 slds-text-align_center"><span class="col-header">Current Freq</span></div>
                        <div class="slds-col slds-size_4-of-12"><span class="col-header">Target Frequency</span></div>
                        <div class="slds-col slds-size_2-of-12 slds-text-align_right"><span class="col-header">New Price</span></div>
                    </div>

                    <template for:each={lineItems} for:item="line">
                        <div key={line.assetId} class="line-row slds-grid slds-grid_vertical-align-center">
                            <div class="slds-col slds-size_3-of-12">
                                <span class="slds-text-body_small">{line.productName}</span>
                            </div>
                            <div class="slds-col slds-size_1-of-12 slds-text-align_right">
                                <span class="slds-text-body_small">{line.currentQuantity}</span>
                            </div>
                            <div class="slds-col slds-size_2-of-12 slds-text-align_center">
                                <span class="freq-badge freq-badge_current">{line.renewalTermUnit}</span>
                            </div>
                            <div class="slds-col slds-size_4-of-12">
                                <template if:true={line.hasUpgradeOptions}>
                                    <lightning-combobox
                                        value={line.selectedPbeId}
                                        placeholder="No change"
                                        options={line.upgradeOptions}
                                        onchange={handleFreqChange}
                                        data-id={line.assetId}
                                        class="freq-combobox">
                                    </lightning-combobox>
                                </template>
                                <template if:false={line.hasUpgradeOptions}>
                                    <span class="slds-text-body_small slds-text-color_weak">Already at max</span>
                                </template>
                            </div>
                            <div class="slds-col slds-size_2-of-12 slds-text-align_right">
                                <template if:true={line.selectedUnitPrice}>
                                    <span class="slds-text-body_small price-changed">${line.selectedUnitPrice}</span>
                                </template>
                                <template if:false={line.selectedUnitPrice}>
                                    <span class="slds-text-body_small slds-text-color_weak">—</span>
                                </template>
                            </div>
                        </div>
                    </template>

                    <template if:true={hasFreqChanges}>
                        <div class="slds-box info-box slds-m-top_medium">
                            <p class="slds-text-body_small">
                                <strong>{changedLineCount}</strong> product(s) will have their billing frequency changed.
                                An Obligation record will be created on the renewal contract for each.
                            </p>
                        </div>
                    </template>

                    <!-- Asset review warning — shown when unchanged lines have null renewal/pricing fields -->
                    <template if:true={hasAssetsNeedingReview}>
                        <div class="slds-box review-warning-box slds-m-top_medium">
                            <div class="slds-grid slds-grid_vertical-align-start slds-m-bottom_x-small">
                                <lightning-icon icon-name="utility:warning" variant="warning" size="x-small"
                                    class="slds-m-right_x-small"></lightning-icon>
                                <p class="slds-text-body_small slds-text-color_weak review-warning-title">
                                    <strong>Asset Review Required</strong> — the following assets have no frequency change selected
                                    and are missing Renewal Term, Renewal Term Unit, or Pricing Source.
                                    These fields must be set on the asset before the renewal order activates correctly.
                                    Confirm you have reviewed them before continuing.
                                </p>
                            </div>
                            <div class="review-table-header slds-grid slds-m-bottom_xx-small">
                                <div class="slds-col slds-size_4-of-12"><span class="col-header">Product</span></div>
                                <div class="slds-col slds-size_2-of-12 slds-text-align_center"><span class="col-header">Renewal Term</span></div>
                                <div class="slds-col slds-size_3-of-12 slds-text-align_center"><span class="col-header">Term Unit</span></div>
                                <div class="slds-col slds-size_3-of-12 slds-text-align_center"><span class="col-header">Pricing Source</span></div>
                            </div>
                            <div class="slds-m-top_small">
                                <lightning-input
                                    type="checkbox"
                                    label="I have reviewed the above assets and understand these fields need to be updated before the renewal activates correctly."
                                    checked={reviewAcknowledged}
                                    onchange={handleReviewAck}>
                                </lightning-input>
                            </div>
                        </div>
                    </template>

                    <template if:true={errorMessage}>
                        <div class="slds-box slds-theme_error slds-m-top_medium">
                            <p class="slds-text-body_small">{errorMessage}</p>
                        </div>
                    </template>
                </template>

                <!-- STEP 3: Submitting progress -->
                <template if:true={isStep3}>
                    <div class="slds-align_absolute-center slds-p-around_large slds-has-flexi-truncate">
                        <div class="slds-text-align_center">
                            <template if:true={isSubmitting}>
                                <lightning-spinner alternative-text="Processing" size="medium"></lightning-spinner>
                                <p class="slds-text-body_regular slds-m-top_medium">{submittingStatus}</p>
                            </template>
                            <template if:false={isSubmitting}>
                                <lightning-icon icon-name="utility:success" variant="success" size="large"></lightning-icon>
                                <p class="slds-text-heading_small slds-m-top_medium">Renewal Complete</p>
                                <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">{completionMessage}</p>
                            </template>
                        </div>
                    </div>
                    <template if:true={errorMessage}>
                        <div class="slds-box slds-theme_error slds-m-top_medium">
                            <p class="slds-text-body_small">{errorMessage}</p>
                        </div>
                    </template>
                </template>

            </div>

            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleClose} class="slds-m-right_small"
                    disabled={isSubmitting}>
                </lightning-button>
                <template if:true={isStep2}>
                    <lightning-button label="Back" onclick={handleBack} class="slds-m-right_small"
                        disabled={isSubmitting}>
                    </lightning-button>
                </template>
                <template if:true={isStep1}>
                    <lightning-button label="Next" variant="brand" onclick={handleNext}
                        disabled={isNextDisabled}>
                    </lightning-button>
                </template>
                <template if:true={isStep2}>
                    <lightning-button label={submitLabel} variant="brand" onclick={handleSubmit}
                        disabled={isSubmitDisabled}>
                    </lightning-button>
                </template>
            </footer>

        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>

    <!-- VF session token iframe -->
    <iframe src="/apex/BullhornSessionProvider" onload={handleIframeLoad}
        style="display:none;" title="Session Provider"></iframe>
</template>
